<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая вкладка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M18.5 18.5l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Painting of the day, proxied by the server; stays empty if it can't load. -->
  <div class="backdrop" aria-hidden="true"><img id="art-img" alt=""></div>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Startpage</h1>
      <!-- Single-user login; the hidden username lets password managers file the entry. -->
      <input type="text" name="username" value="startpage" autocomplete="username" hidden>
      <input id="login-password" type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <span id="login-error" class="error" role="alert"></span>
    </form>
  </section>

  <main id="app" class="wrap" hidden>
    <p id="demo-banner" class="demo-banner" hidden>
      Демо: только просмотр, изменения отключены.
      <a href="https://github.com/mgrubiyan/startpage">Исходники на GitHub</a>
    </p>
    <header class="top">
      <div class="clock">
        <div id="time" class="time">--:--</div>
        <div id="date" class="date"></div>
      </div>
      <div class="widgets">
        <div class="chip" id="weather" title="Погода">
          <span class="chip-label" id="weather-city">Погода</span>
          <span class="chip-value" id="weather-value">—</span>
        </div>
        <div class="chip" id="rates" title="Курс ЦБ РФ">
          <span class="chip-label">ЦБ РФ</span>
          <span class="chip-value" id="rates-value">—</span>
        </div>
      </div>
    </header>

    <form id="search" class="search" autocomplete="off" role="search">
      <input id="q" name="q" type="text" spellcheck="false" autofocus
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions"
             placeholder="Поиск или адрес · g y d gh yt w — префиксы">
      <span id="engine-hint" class="engine-hint"></span>
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>

    <section class="section-head">
      <h2>Закладки</h2>
      <div class="actions">
        <button type="button" id="edit-toggle" class="ghost edit-only">Изменить</button>
        <button type="button" id="settings-toggle" class="ghost edit-only">Настройки</button>
        <button type="button" id="logout" class="ghost edit-only">Выйти</button>
      </div>
    </section>

    <ul id="bookmarks" class="bookmarks"></ul>

    <form id="add-bookmark" class="inline-form" hidden>
      <input id="bm-title" type="text" placeholder="Название" required maxlength="40">
      <input id="bm-url" type="text" placeholder="https://…" required>
      <button type="submit">Добавить</button>
      <span id="bm-error" class="error"></span>
    </form>

    <form id="settings" class="settings" hidden>
      <label>Поиск по умолчанию
        <select id="set-engine"></select>
      </label>
      <label>Город для погоды
        <input id="set-city" type="text" maxlength="60" required>
      </label>
      <!-- Quotes are off in the demo, so their tickers are too. -->
      <label class="edit-only" id="set-crypto-label">Криптовалюты, до 8
        <input id="set-crypto" type="text" maxlength="100" placeholder="BTC ETH SOL TON"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <label class="edit-only" id="set-shares-label">Акции Мосбиржи, до 8
        <input id="set-shares" type="text" maxlength="120" placeholder="SBER GAZP LKOH YDEX"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <!-- Write-only: a saved link is read access to the calendar, so the page never gets it back. -->
      <label class="edit-only wide" id="set-calendars-label">Календари, до 4: ссылки по одной в строке
        <textarea id="set-calendars" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"
                  placeholder="webcal://p00-caldav.icloud.com/published/2/…"></textarea>
      </label>
      <p class="edit-only wide muted set-hint" id="set-calendars-hint"></p>
      <button type="submit">Сохранить</button>
      <button type="button" id="set-calendars-off" class="ghost edit-only" hidden>Отключить календари</button>
      <span id="set-status" class="muted"></span>
    </form>

    <div class="desk">
      <section class="panel" aria-labelledby="tasks-h">
        <div class="section-head">
          <h2 id="tasks-h">Задачи</h2>
          <div class="actions">
            <button type="button" id="tasks-clear" class="ghost edit-only" hidden>Убрать выполненные</button>
          </div>
        </div>
        <form id="add-task" class="task-form edit-only" autocomplete="off">
          <input id="task-title" type="text" placeholder="Новая задача — Enter" maxlength="200" required
                 aria-label="Новая задача">
        </form>
        <ul id="tasks" class="tasks"></ul>
        <span id="tasks-error" class="error" role="alert"></span>
      </section>
      <section class="panel" aria-labelledby="note-h">
        <div class="section-head">
          <h2 id="note-h">Заметки</h2>
          <span id="note-status" class="note-status" aria-live="polite"></span>
        </div>
        <textarea id="note" class="note" maxlength="10000" aria-labelledby="note-h"
                  placeholder="Что угодно: сохранится само"></textarea>
      </section>
    </div>

    <section class="board" id="calendar-board" aria-labelledby="calendar-h" hidden>
      <div class="section-head">
        <h2 id="calendar-h">Календарь</h2>
      </div>
      <div id="calendar" class="agenda"></div>
    </section>

    <section class="board" aria-labelledby="forecast-h">
      <div class="section-head">
        <h2 id="forecast-h">Прогноз</h2>
        <span id="sun" class="sun"></span>
      </div>
      <ol id="forecast" class="forecast"></ol>
    </section>

    <section class="board" aria-labelledby="markets-h">
      <div class="section-head">
        <h2 id="markets-h">Рынки</h2>
      </div>
      <div id="markets" class="markets"></div>
    </section>

    <section class="section-head services-head">
      <h2>Сервисы</h2>
      <div class="actions">
        <button type="button" id="services-edit" class="ghost edit-only">Изменить</button>
      </div>
    </section>
    <ul id="services" class="services"></ul>

    <form id="add-service" class="inline-form" hidden>
      <input id="svc-name" type="text" placeholder="Название" required maxlength="60">
      <input id="svc-url" type="text" placeholder="https://bots.example.ru/health" required>
      <button type="submit">Добавить</button>
      <span id="svc-error" class="error"></span>
    </form>
  </main>
  <!-- Last, so on narrow screens it sits under the content instead of over it. -->
  <a id="art-caption" class="art-caption" target="_blank" rel="noopener noreferrer" hidden></a>
  <script src="app.js"></script>
</body>
</html>
