name: vulncheck

# Reports known vulnerabilities in the code paths this module actually calls,
# in its dependencies and in the Go standard library. The weekly run catches
# advisories published while nothing is being pushed; GitHub emails the repo
# owner when a scheduled run fails.
on:
  push:
    branches: [main, "feat/**", "fix/**", "ci/**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The same release line as the Dockerfile's golang:1.27-alpine, latest
          # patch: govulncheck judges the standard library of the Go it runs with.
          go-version: "1.27.x"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
