name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test (race detector, Postgres integration tests included)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # golangci-lint v2.13.2 needs Go >= 1.26 to build (go install below). A newer
          # toolchain lints this go 1.25 module the same way the prebuilt binary did.
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # Build the linter with `go install` through the Go module proxy instead of
          # downloading the release binary from GitHub Releases. lint is a required
          # check on main, so a Releases outage (504s on 2026-11-08) must not block merges.
          install-mode: goinstall

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t startpage:ci .

  # Runs only for main, after every check above passed. Only this job may write packages.
  publish:
    needs: [test, lint, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  # Off until the repository variable DEPLOY_HOST is set (secrets can't be used in a
  # job-level if). Needs DEPLOY_USER as a variable and DEPLOY_SSH_KEY and
  # DEPLOY_KNOWN_HOSTS as secrets; see deploy/README.md.
  deploy:
    needs: publish
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Pull and restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # $TAG expands here on purpose: the server runs the image of this commit.
          # shellcheck disable=SC2029
          ssh "$TARGET" "cd /opt/startpage && export STARTPAGE_TAG=$TAG && docker compose pull && docker compose up -d && docker image prune -f"
